name: PhysicsClay setup
description: >
  scripts/setup.sh in CI: .venv with the chosen extras, the robot models (mink examples at the pinned ref, in vendor/)
  and the MediaPipe models (models/), the last two cached. Every job that builds a world needs the robot models.
inputs:
  extras:
    description: pyproject extras for the .venv (PC_EXTRAS of scripts/setup.sh)
    required: true
  python:
    description: Python version for the .venv
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.3   # setup-uv publishes no floating major tags
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Cache robot models and MediaPipe models
      uses: actions/cache@v6
      with:
        path: |
          vendor/mink
          models
        key: robot-assets-${{ hashFiles('scripts/setup.sh') }}

    - name: Setup (scripts/setup.sh)
      shell: bash
      run: PC_EXTRAS="${{ inputs.extras }}" PC_PYTHON="${{ inputs.python }}" ./scripts/setup.sh

    - name: Robot models are on disk
      shell: bash
      run: test -f vendor/mink/examples/franka_emika_panda/mjx_panda.xml && test -f vendor/mink/examples/universal_robots_ur5e/ur5e.xml
