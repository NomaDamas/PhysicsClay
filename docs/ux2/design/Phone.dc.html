<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhysicsClay · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5c77df}a:hover{color:#3f59c4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fbfbfd; font-family: Inter, -apple-system, system-ui, sans-serif; color: #1d1d1f; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <header style="height: 56px; flex: 0 0 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px">
    <div style="width: 26px; height: 26px; border-radius: 8px; background: #5c77df; display: flex; align-items: center; justify-content: center">
      <div style="width: 10px; height: 10px; border-radius: 3px; background: #f59145"></div>
    </div>
    <span style="font-size: 15px; font-weight: 700; flex: 1 1 auto">PhysicsClay</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: rgba(29,29,31,.72)"><span style="width: 7px; height: 7px; border-radius: 999px; background: #1f8f55"></span>G1 ready</span>
    <button type="button" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #1d1d1f">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
    </button>
  </header>

  <div style="position: relative; margin: 0 12px; height: 330px; flex: 0 0 330px; border-radius: 22px; background: #eef0f4; overflow: hidden">
    <svg width="366" height="330" viewBox="0 0 366 330" role="img" aria-label="3D stage with the robot's planned path over the vase to marker P">
      <polygon points="40,190 270,160 340,210 110,250" fill="#ffffff" stroke="#d9dce4" stroke-width="2"></polygon>
      <polygon points="110,250 340,210 340,220 110,260" fill="#e2e5ec"></polygon>
      <circle cx="36" cy="92" r="13" fill="#d4d7e0" stroke="#aeb3c0" stroke-width="2"></circle>
      <rect x="22" y="108" width="28" height="60" rx="12" fill="#d4d7e0" stroke="#aeb3c0" stroke-width="2"></rect>
      <path d="M210 186 L210 140 C 210 130, 230 130, 230 140 L230 186 Z" fill="#b679e1" opacity=".85"></path>
      <rect x="96" y="176" width="26" height="26" rx="4" fill="#ffffff" stroke="#9aa0ad" stroke-width="2"></rect>
      <rect x="250" y="196" width="22" height="16" rx="3" fill="#ed7473"></rect>
      <path d="M110 170 C 140 96, 250 80, 296 186" stroke="#5c77df" stroke-width="3" stroke-dasharray="7 6" fill="none" stroke-linecap="round"></path>
      <g fill="#1f8f55" stroke="#ffffff" stroke-width="2"><circle cx="128" cy="134" r="5"></circle><circle cx="170" cy="106" r="5"></circle><circle cx="220" cy="98" r="5"></circle><circle cx="266" cy="120" r="5"></circle></g>
      <ellipse cx="298" cy="204" rx="22" ry="8" fill="none" stroke="#f59145" stroke-width="3"></ellipse>
      <circle cx="326" cy="190" r="11" fill="#f59145"></circle>
      <text x="326" y="194" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">P</text>
    </svg>
    <div style="position: absolute; left: 10px; top: 10px; width: 96px; height: 72px; border-radius: 12px; overflow: hidden; background: #26262b; border: 2px solid #ffffff">
      <svg width="96" height="72" viewBox="0 0 96 72" role="img" aria-label="Your camera: pointing">
        <rect width="96" height="72" fill="#26262b"></rect>
        <g stroke="#5fd08a" stroke-width="2.5" stroke-linecap="round" fill="none"><path d="M44 24 L44 50"></path><path d="M36 30 L52 30 L68 34"></path><path d="M36 30 L32 46"></path></g>
        <circle cx="44" cy="18" r="5" fill="none" stroke="#5fd08a" stroke-width="2.5"></circle>
        <path d="M68 34 L92 37" stroke="#f59145" stroke-width="2" stroke-dasharray="3 3"></path>
      </svg>
    </div>
    <div style="position: absolute; right: 10px; top: 10px; display: flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.94)">
      <button type="button" aria-pressed="true" style="height: 30px; padding: 0 11px; border-radius: 999px; border: 0; background: #1d1d1f; color: #ffffff; font: 600 12px Inter, sans-serif">3D</button>
      <button type="button" aria-pressed="false" style="height: 30px; padding: 0 11px; border-radius: 999px; border: 0; background: transparent; color: #1d1d1f; font: 500 12px Inter, sans-serif">Robot eye</button>
    </div>
  </div>

  <section aria-label="Robot's plan" style="margin: 12px 12px 0; border-radius: 24px; background: #ffffff; border: 1px solid rgba(29,29,31,.08); box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 22px 48px rgba(40,30,90,.12); padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 40px; height: 4px; border-radius: 999px; background: rgba(29,29,31,.16); align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: rgba(29,29,31,.62)">Robot's plan</span>
      <span style="padding: 3px 9px; border-radius: 999px; background: rgba(245,145,69,.14); color: #a8561a; font-size: 11px; font-weight: 600">Waiting for you</span>
    </div>
    <p style="margin: 0; font-size: 18px; line-height: 1.3; font-weight: 600">Move the mug to P, over the vase.</p>
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: rgba(31,143,85,.08)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f8f55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"></path></svg>
      <span style="font-size: 13px; font-weight: 600; color: #17703f">I can do this</span>
      <span style="font-size: 12px; color: rgba(29,29,31,.72)">· 3 steps · about 6 s</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1 1 auto; height: 48px; border-radius: 14px; border: 0; background: #5c77df; color: #ffffff; font: 600 15px Inter, sans-serif">Run it</button>
      <button type="button" style="height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid rgba(29,29,31,.14); background: #ffffff; color: #1d1d1f; font: 600 14px Inter, sans-serif">Fix</button>
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 22px; background: rgba(251,251,253,.96); border-top: 1px solid rgba(29,29,31,.08); display: flex; flex-direction: column; gap: 10px">
    <div role="toolbar" aria-label="Ways to show" style="display: flex; gap: 6px; overflow-x: auto">
      <button type="button" aria-pressed="true" style="flex: 0 0 auto; height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid #5c77df; background: #5c77df; color: #ffffff; font: 500 13px Inter, sans-serif">Point</button>
      <button type="button" aria-pressed="false" style="flex: 0 0 auto; height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid rgba(29,29,31,.1); background: #ffffff; color: #1d1d1f; font: 500 13px Inter, sans-serif">Zone</button>
      <button type="button" aria-pressed="false" style="flex: 0 0 auto; height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid rgba(29,29,31,.1); background: #ffffff; color: #1d1d1f; font: 500 13px Inter, sans-serif">Goal</button>
      <button type="button" aria-pressed="false" style="flex: 0 0 auto; height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid rgba(29,29,31,.1); background: #ffffff; color: #1d1d1f; font: 500 13px Inter, sans-serif">Show</button>
      <button type="button" aria-pressed="false" style="flex: 0 0 auto; height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid rgba(29,29,31,.1); background: #ffffff; color: #1d1d1f; font: 500 13px Inter, sans-serif">Path</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <label for="pcmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Instruction</label>
      <input id="pcmd" type="text" placeholder="Say it, point, or type…" style="flex: 1 1 auto; min-width: 0; height: 48px; border: 0; border-radius: 999px; background: #f0f0f3; padding: 0 16px; font: 400 15px Inter, sans-serif; color: #1d1d1f">
      <button type="button" aria-label="Talk" style="flex: 0 0 56px; width: 56px; height: 56px; border-radius: 999px; border: 0; background: #5c77df; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px rgba(92,119,223,.16)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>

return {};
}
}
</script>
</body>
</html>
